<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ZOVARO Marketplace Moderation</title><link rel="stylesheet" href="marketplace.css"><style>body{min-height:100vh;background:#020817;color:#eaf4ff;font-family:Arial,sans-serif;padding:28px}.admin-wrap{max-width:1000px;margin:auto}.admin-panel,.admin-card{background:#07172d;border:1px solid #16466b;border-radius:16px;padding:22px;margin:18px 0}.admin-panel input{padding:12px;border-radius:8px;border:1px solid #315b78;background:#020817;color:white;max-width:360px;width:100%}.admin-panel button,.admin-actions button{padding:11px 16px;border:0;border-radius:8px;background:#087fe5;color:white;font-weight:bold;cursor:pointer;margin:5px}.admin-actions .reject{background:#7c2835}.admin-meta{color:#9db7d1;font-size:12px}.admin-card h2{margin:8px 0}.admin-description{white-space:pre-wrap;line-height:1.6}.admin-error{color:#ff9e9e}.hidden{display:none!important}</style></head>
<body><main class="admin-wrap"><h1>ZOVARO · Marketplace moderation</h1><p>Only authenticated administrators can review pending job and product listings.</p>
<section id="loginPanel" class="admin-panel"><h2>Administrator login</h2><form id="loginForm"><input id="adminPassword" type="password" minlength="16" autocomplete="current-password" required placeholder="Admin password"><button type="submit">SIGN IN</button></form><p id="loginStatus" role="status"></p></section>
<section id="queuePanel" class="hidden"><div class="admin-panel"><button id="refreshQueue" type="button">REFRESH QUEUE</button><button id="logoutButton" type="button">SIGN OUT</button><p id="queueStatus" role="status"></p></div><div id="pendingQueue"></div></section></main>
<script>
const $=id=>document.getElementById(id);
async function loadQueue(){ $("queueStatus").textContent="Loading pending submissions…";try{const r=await fetch("/api/marketplace-admin",{cache:"no-store"});const d=await r.json();if(!r.ok)throw new Error(d.error||"Access denied");const root=$("pendingQueue");root.replaceChildren();if(!d.pending.length){$("queueStatus").textContent="No pending listings.";return;}$("queueStatus").textContent=d.pending.length+" pending listing(s).";for(const item of d.pending){const card=document.createElement("article");card.className="admin-card";const title=document.createElement("h2");title.textContent=item.title;card.append(title);const meta=document.createElement("p");meta.className="admin-meta";meta.textContent=[item.type,item.company,item.category,item.location,item.createdAt].filter(Boolean).join(" · ");card.append(meta);const desc=document.createElement("p");desc.className="admin-description";desc.textContent=item.description;card.append(desc);const contact=document.createElement("p");contact.textContent="Public contact consent: "+(item.publicContact?"Yes":"No")+" · "+(item.contactEmail||"");card.append(contact);if(item.price!=null){const price=document.createElement("p");price.textContent="Price: "+item.price+" "+item.currency+" · Condition: "+item.condition;card.append(price);}const actions=document.createElement("div");actions.className="admin-actions";for(const [label,decision] of [["APPROVE","approve"],["REJECT","reject"]]){const b=document.createElement("button");b.type="button";b.textContent=label;if(decision==="reject")b.className="reject";b.addEventListener("click",()=>moderate(item,decision,b));actions.append(b);}card.append(actions);root.append(card);}}catch(e){$("queueStatus").textContent=e.message;$("queueStatus").className="admin-error";}}
async function moderate(item,decision,button){button.disabled=true;try{const r=await fetch("/api/marketplace-admin",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({type:item.type,id:item.id,decision})});const d=await r.json();if(!r.ok)throw new Error(d.error||"Moderation failed");await loadQueue();}catch(e){$("queueStatus").textContent=e.message;button.disabled=false;}}
$("loginForm").addEventListener("submit",async e=>{e.preventDefault();$("loginStatus").textContent="Signing in…";try{const r=await fetch("/api/lead-admin-login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:$("adminPassword").value})});const d=await r.json();if(!r.ok)throw new Error(d.error||"Login failed");$("loginPanel").classList.add("hidden");$("queuePanel").classList.remove("hidden");$("adminPassword").value="";loadQueue();}catch(err){$("loginStatus").textContent=err.message;}});
$("refreshQueue").addEventListener("click",loadQueue);
$("logoutButton").addEventListener("click",async()=>{await fetch("/api/lead-admin-login",{method:"DELETE"});$("queuePanel").classList.add("hidden");$("loginPanel").classList.remove("hidden");});
</script></body></html>
