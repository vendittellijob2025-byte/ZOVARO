<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ZOVARO Marketplace Control</title><link rel="stylesheet" href="marketplace.css"><style>
body{min-height:100vh;background:#020817;color:#eaf4ff;font-family:Arial,sans-serif;padding:24px}.admin-wrap{max-width:1100px;margin:auto}.admin-panel,.admin-card{background:#07172d;border:1px solid #16466b;border-radius:16px;padding:20px;margin:16px 0}.admin-panel input{padding:12px;border-radius:8px;border:1px solid #315b78;background:#020817;color:white;max-width:360px;width:100%}.admin-panel button,.admin-actions button,.admin-more{padding:10px 14px;border:0;border-radius:8px;background:#087fe5;color:white;font-weight:bold;cursor:pointer;margin:4px}.admin-actions .reject{background:#7c2835}.admin-meta{color:#9db7d1;font-size:12px}.admin-card h2{margin:8px 0}.admin-description{white-space:pre-wrap;line-height:1.6}.admin-error{color:#ff9e9e}.hidden{display:none!important}.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{background:#0c2542;border:1px solid #1c547e;border-radius:10px;padding:12px 16px}.stat b{display:block;font-size:22px}.admin-section{margin-top:30px}.pill{color:#60d6ff;font-size:11px;text-transform:uppercase;font-weight:bold}.reason{color:#ffd18b;font-size:13px;line-height:1.5}.admin-actions{display:flex;gap:8px;flex-wrap:wrap}
</style></head><body><main class="admin-wrap"><h1>ZOVARO · Marketplace Control Center</h1><p>Low-risk listings are screened automatically. Uncertain or higher-risk cases stay private until review.</p>
<section id="loginPanel" class="admin-panel"><h2>Administrator login</h2><form id="loginForm"><input id="adminPassword" type="password" minlength="16" autocomplete="current-password" required placeholder="Admin password"><button type="submit">SIGN IN</button></form><p id="loginStatus" role="status"></p></section>
<section id="queuePanel" class="hidden"><div class="admin-panel"><div class="stats"><div class="stat">Awaiting review<b id="pendingCount">0</b></div><div class="stat">Reports<b id="reportCount">0</b></div><div class="stat">Appeals<b id="appealCount">0</b></div></div><button id="refreshQueue" type="button">REFRESH QUEUE</button><button id="logoutButton" type="button">SIGN OUT</button><p id="queueStatus" role="status"></p></div>
<section class="admin-section"><h2>Listings requiring review</h2><div id="pendingQueue"></div><button id="pendingLoadMore" class="admin-more hidden" type="button">LOAD MORE PENDING</button></section>
<section class="admin-section"><h2>Reports from visitors</h2><div id="reportsQueue"></div></section><section class="admin-section"><h2>Appeals</h2><div id="appealsQueue"></div></section></section></main>
<script>
const $=id=>document.getElementById(id);
let pendingCursor=null;
async function api(body){const r=await fetch("/api/marketplace",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw new Error(d.error||"Request failed");return d;}
function node(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n;}
async function loadQueue(append=false){$("queueStatus").textContent="Loading…";try{const url="/api/marketplace?admin=1"+(append&&pendingCursor?"&cursor="+encodeURIComponent(pendingCursor):"");const r=await fetch(url,{cache:"no-store"});const d=await r.json();if(!r.ok)throw new Error(d.error||"Access denied");$("pendingCount").textContent=d.pending.length;$("reportCount").textContent=d.reports.length;$("appealCount").textContent=d.appeals.length;$("queueStatus").textContent="Moderation data refreshed.";renderListings(d.pending,append);pendingCursor=d.pendingCursor||null;$("pendingLoadMore").classList.toggle("hidden",!pendingCursor);if(!append){renderCases("reportsQueue",d.reports,"reports");renderCases("appealsQueue",d.appeals,"appeals");}}catch(e){$("queueStatus").textContent=e.message;$("queueStatus").className="admin-error";}}
function renderListings(items,append=false){const root=$("pendingQueue");if(!append)root.replaceChildren();if(!items.length&&!append){root.append(node("p","admin-meta","No listings require review."));return;}for(const item of items){const card=node("article","admin-card");card.append(node("span","pill",item.type+" · "+item.status));card.append(node("h2","",item.title));card.append(node("p","admin-meta",[item.company,item.sellerDisplayName,item.category,item.location,item.createdAt].filter(Boolean).join(" · ")));card.append(node("p","admin-description",item.description));card.append(node("p","admin-meta","Contact: "+(item.contactEmail||"")+" · Seller type: "+(item.traderType||"not supplied")));if(item.imageUrl)card.append(node("p","admin-meta","Image URL: "+item.imageUrl));if(item.price!=null)card.append(node("p","admin-meta","Price: "+item.price+" "+item.currency+" · Condition: "+item.condition));for(const reason of item.moderation?.reasons||[])card.append(node("p","reason","Screening: "+reason));const actions=node("div","admin-actions");for(const [label,decision] of [["APPROVE","approve"],["REJECT","reject"]]){const b=node("button",decision==="reject"?"reject":"",label);b.addEventListener("click",async()=>{b.disabled=true;try{await api({action:"moderate",type:item.type,id:item.id,decision});pendingCursor=null;await loadQueue(false);}catch(e){$("queueStatus").textContent=e.message;b.disabled=false;}});actions.append(b);}card.append(actions);root.append(card);}}
function renderCases(rootId,items,kind){const root=$(rootId);root.replaceChildren();if(!items.length){root.append(node("p","admin-meta","No open cases."));return;}for(const item of items){const card=node("article","admin-card");card.append(node("span","pill",kind+" · "+item.status));card.append(node("p","admin-meta","Listing ID: "+item.listingId+" · From: "+item.email));card.append(node("p","",item.reason||""));card.append(node("p","admin-description",item.details));const b=node("button","","CLOSE CASE");b.addEventListener("click",async()=>{b.disabled=true;try{await api({action:"close_case",kind,id:item.id});await loadQueue();}catch(e){$("queueStatus").textContent=e.message;b.disabled=false;}});card.append(b);root.append(card);}}
$("loginForm").addEventListener("submit",async e=>{e.preventDefault();$("loginStatus").textContent="Signing in…";try{const r=await fetch("/api/lead-admin-login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:$("adminPassword").value})});const d=await r.json();if(!r.ok)throw new Error(d.error||"Login failed");$("loginPanel").classList.add("hidden");$("queuePanel").classList.remove("hidden");$("adminPassword").value="";pendingCursor=null;loadQueue();}catch(err){$("loginStatus").textContent=err.message;}});
$("refreshQueue").addEventListener("click",()=>{pendingCursor=null;loadQueue(false);});$("pendingLoadMore").addEventListener("click",()=>loadQueue(true));$("logoutButton").addEventListener("click",async()=>{await fetch("/api/lead-admin-login",{method:"DELETE"});$("queuePanel").classList.add("hidden");$("loginPanel").classList.remove("hidden");});
</script></body></html>
