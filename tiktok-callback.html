<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZOVARO — TikTok Authorization</title>
</head>
<body>
  <h1>ZOVARO</h1>
  <p>TikTok authorization received.</p>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");
    const state = params.get("state");

    if (code) {
      console.log("TikTok authorization code received.");
    }

    if (state) {
      console.log("TikTok state received.");
    }
  </script>
</body>
</html>
