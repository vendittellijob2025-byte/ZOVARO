<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZOVARO — TikTok Authorization</title>
</head>
<body>
  <h1>ZOVARO</h1>
  <p id="status">Processing TikTok authorization...</p>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");
    const state = params.get("state");

    if (!code || !state) {
      document.getElementById("status").textContent =
        "TikTok authorization data missing.";
    } else {
      fetch(
        "https://zovaro.vercel.app/api/tiktok-callback?" +
        new URLSearchParams({ code, state })
      )
        .then(response => response.json())
        .then(data => {
          if (data.success) {
            document.getElementById("status").textContent =
              "TikTok authorization completed successfully.";
          } else {
            document.getElementById("status").textContent =
              "TikTok authorization failed.";
            console.error(data);
          }
        })
        .catch(error => {
          document.getElementById("status").textContent =
            "Connection error.";
          console.error(error);
        });
    }
  </script>
</body>
</html>
