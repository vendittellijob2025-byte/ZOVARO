<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ZOVARO — TikTok Authorization</title>
</head>

<body>

  <h1>ZOVARO</h1>

  <p id="status">
    Processing TikTok authorization...
  </p>

  <script>

    const params =
      new URLSearchParams(
        window.location.search
      );

    const code =
      params.get("code");

    const state =
      params.get("state");

    const status =
      document.getElementById("status");


    if (!code || !state) {

      status.textContent =
        "TikTok authorization data missing.";

    } else {

      fetch(
        "https://zovaro.vercel.app/api/tiktok-callback?" +
        new URLSearchParams({
          code,
          state
        })
      )

        .then(async response => {

          const data =
            await response.json();

          if (!response.ok) {

            throw new Error(
              data.error ||
              "TikTok authorization failed."
            );
          }

          return data;

        })

        .then(data => {

          if (
            data.success &&
            data.session_token
          ) {

            sessionStorage.setItem(
              "zovaro_tiktok_session",
              data.session_token
            );

            sessionStorage.setItem(
              "zovaro_tiktok_session_expires",
              String(
                data.expires_at || ""
              )
            );

            status.textContent =
              "TikTok authorization completed successfully.";

            /*
             * Torna automaticamente alla pagina
             * principale ZOVARO nella stessa scheda.
             */
            setTimeout(() => {

              window.location.replace(
                "https://vendittellijob2025-byte.github.io/ZOVARO/"
              );

            }, 700);

          } else {

            status.textContent =
              "TikTok authorization failed.";

            console.error(data);
          }

        })

        .catch(error => {

          status.textContent =
            "Connection error.";

          console.error(error);

        });

    }

  </script>

</body>
</html>
