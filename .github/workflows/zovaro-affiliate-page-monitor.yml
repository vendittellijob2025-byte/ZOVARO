name: ZOVARO - Weekly Affiliate Partner Page Monitor

on:
  workflow_dispatch:
  schedule:
    # 08:10 America/Bogota (UTC-5), every Monday.
    - cron: "10 13 * * 1"

permissions:
  contents: read

concurrency:
  group: zovaro-affiliate-page-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check public affiliate programme pages
        run: node scripts/zovaro-affiliate-page-monitor.mjs
      - name: Upload weekly partner monitor
        uses: actions/upload-artifact@v4
        with:
          name: zovaro-affiliate-page-monitor
          path: reports/zovaro-affiliate-page-monitor.json
          if-no-files-found: error
          retention-days: 30
