name: ZOVARO AUTOPILOT - Six-Hour Operations Audit

on:
  push:
    branches:
      - main
    paths:
      - "lib/product-category.js"
      - "scripts/zovaro-autopilot-audit.mjs"
      - ".github/workflows/zovaro-autopilot.yml"
      - "scripts/test-product-category.mjs"
      - "scripts/validate-product-category-rules.mjs"
      - "scripts/audit-category-quality.mjs"
      - "scripts/validate-direct-partners.mjs"
      - "data/catalog.json"
      - "data/category-tree.json"
      - "data/direct-partners.json"
      - "data/partner-opportunities.json"
  workflow_dispatch:
  schedule:
    # Every six hours. GitHub-hosted execution continues while the owner's computer is off.
    - cron: "40 */6 * * *"

permissions:
  contents: read

concurrency:
  group: zovaro-autopilot-audit
  cancel-in-progress: false

jobs:
  six-hour-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test product classification rules
        id: category-tests
        run: |
          node scripts/test-product-category.mjs
          node scripts/validate-product-category-rules.mjs

      - name: Audit category quality
        id: category-audit
        continue-on-error: true
        run: node scripts/audit-category-quality.mjs

      - name: Validate affiliate partner registry
        id: partner-audit
        continue-on-error: true
        run: node scripts/validate-direct-partners.mjs

      - name: Generate read-only operational report
        if: always()
        env:
          CATEGORY_TESTS_OUTCOME: ${{ steps.category-tests.outcome }}
          CATEGORY_AUDIT_OUTCOME: ${{ steps.category-audit.outcome }}
          PARTNER_AUDIT_OUTCOME: ${{ steps.partner-audit.outcome }}
        run: node scripts/zovaro-autopilot-audit.mjs

      - name: Upload daily report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zovaro-autopilot-report
          path: reports/zovaro-autopilot-report.json
          if-no-files-found: error
          retention-days: 30
