name: ZOVARO - Generate and publish 4 daily social videos

on:
  workflow_dispatch:
  schedule:
    - cron: "0 11 * * *"

permissions:
  contents: write

concurrency:
  group: zovaro-daily-social-publishing
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Generate one SHOP video
        run: |
          node scripts/select-product.mjs
          node scripts/preflight-product-images.mjs
          node scripts/split-selected-products.mjs
          node scripts/create-promotion.mjs
          mkdir -p zovaro-shop-videos
          SELECTED_PRODUCTS_PATH=".zovaro-shop-batches/products-1.json" VIDEO_OUTPUT_PATH="data/tiktok-video.mp4" node scripts/create-tiktok-video.mjs
      - name: Generate three JOB videos and LUXURY video
        run: node scripts/create-category-videos.mjs zovaro-social-videos
      - name: Generate advertiser video
        run: |
          mkdir -p zovaro-social-videos
          ffmpeg -y -hide_banner -loglevel error \
            -loop 1 -framerate 30 -t 35 -i "assets/shop-visual.png" \
            -stream_loop -1 -i "assets/ZOVARO_AFFILIATE.MP3" \
            -i "assets/zovaro-logo.png" \
            -filter_complex "[0:v]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,drawbox=x=55:y=330:w=970:h=1220:color=black@0.84:t=fill,drawbox=x=55:y=330:w=970:h=1220:color=0x00D9FF:t=6,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='ADVERTISE YOUR BUSINESS':fontcolor=0x00D9FF:fontsize=62:x=(w-text_w)/2:y=560,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='ON ZOVARO WORLDWIDE':fontcolor=white:fontsize=46:x=(w-text_w)/2:y=720,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='Products · Services · Shops · Rentals':fontcolor=white:fontsize=30:x=(w-text_w)/2:y=900,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='US$9.99 / MONTH':fontcolor=0x00D9FF:fontsize=48:x=(w-text_w)/2:y=1080,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='US$99 / YEAR':fontcolor=0x00D9FF:fontsize=48:x=(w-text_w)/2:y=1180,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='Discover better. Reach the world.':fontcolor=white:fontsize=28:x=(w-text_w)/2:y=1370,fade=t=in:st=0:d=1,fade=t=out:st=33:d=2,format=yuv420p[v];[2:v]scale=300:-1[logo];[v][logo]overlay=(W-w)/2:90:format=auto[out]" \
            -map "[out]" -map 1:a -t 35 -r 30 -c:v libx264 -preset veryfast -crf 26 -pix_fmt yuv420p -c:a aac -b:a 160k -shortest -movflags +faststart \
            zovaro-social-videos/ZOVARO-ADVERTISERS-DAILY.mp4
      - name: Verify exactly four daily videos
        run: |
          test -s data/tiktok-video.mp4
          test -s zovaro-social-videos/ZOVARO-JOBS-DAILY.mp4
          test -s zovaro-social-videos/ZOVARO-LUXURY-DAILY.mp4
          for FILE in data/tiktok-video.mp4 zovaro-social-videos/ZOVARO-JOBS-DAILY.mp4 zovaro-social-videos/ZOVARO-LUXURY-DAILY.mp4; do
            test -s "$FILE"
            ffprobe -v error -show_entries format=duration -of csv=p=0 "$FILE"
          done
      - name: Publish four videos to Buffer queues
        env:
          BUFFER_API_TOKEN: ${{ secrets.BUFFER_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/publish-daily-buffer-videos.mjs
