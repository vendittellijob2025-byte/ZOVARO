name: ZOVARO - Generate 3 and publish 4 daily social videos

on:
  workflow_dispatch:
  schedule:
    - cron: "0 11 * * *"

permissions:
  contents: write

concurrency:
  group: zovaro-daily-social-publishing
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Generate one SHOP video
        run: |
          node scripts/select-product.mjs
          node scripts/preflight-product-images.mjs
          node scripts/split-selected-products.mjs
          node scripts/create-promotion.mjs
          mkdir -p zovaro-shop-videos
          SELECTED_PRODUCTS_PATH=".zovaro-shop-batches/products-1.json" VIDEO_OUTPUT_PATH="data/tiktok-video.mp4" node scripts/create-tiktok-video.mjs
      - name: Generate JOB, LUXURY and ADVERTISERS videos
        run: node scripts/create-category-videos.mjs zovaro-social-videos
      - name: Verify exactly three generated videos
        run: |
          test -s data/tiktok-video.mp4
          test -s zovaro-social-videos/ZOVARO-JOBS-DAILY.mp4
          test -s zovaro-social-videos/ZOVARO-LUXURY-DAILY.mp4
          test -s zovaro-social-videos/ZOVARO-ADVERTISERS-DAILY.mp4
          for FILE in data/tiktok-video.mp4 zovaro-social-videos/ZOVARO-JOBS-DAILY.mp4 zovaro-social-videos/ZOVARO-LUXURY-DAILY.mp4 zovaro-social-videos/ZOVARO-ADVERTISERS-DAILY.mp4; do
            test -s "$FILE"
            ffprobe -v error -show_entries format=duration -of csv=p=0 "$FILE"
          done
      - name: Publish four videos to Buffer queues
        env:
          BUFFER_API_TOKEN: ${{ secrets.BUFFER_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/publish-daily-buffer-videos.mjs
