name: ZOVARO - Daily Promotion

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/daily-promotion.yml"

permissions:
  contents: write

concurrency:
  group: zovaro-daily-promotion
  cancel-in-progress: false

jobs:
  daily-promotion:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Select products
        run: node scripts/select-product.mjs

      - name: Create promotion package
        run: node scripts/create-promotion.mjs

      - name: Create automatic TikTok video
        run: node scripts/create-tiktok-video.mjs

      - name: Verify generated video
        run: |
          test -s data/tiktok-video.mp4
          DURATION="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 data/tiktok-video.mp4)"
          node -e 'const d=Number(process.argv[1]); if (!Number.isFinite(d) || d < 10 || d > 180) throw new Error("Generated video duration is invalid: " + process.argv[1]); console.log("Verified TikTok video duration: " + d.toFixed(1) + " seconds.");' "$DURATION"

      - name: Save daily promotion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/selected-product.json data/selected-products.json data/promotion.json data/social-image.svg data/tiktok-video.mp4
          git diff --cached --quiet || git commit -m "Update daily promotion video"
          git push
