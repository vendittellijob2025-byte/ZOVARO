name: ZOVARO - Daily Promotion

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"

permissions:
  contents: write

jobs:
  daily-promotion:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Select products
        run: node scripts/select-product.mjs

      - name: Create promotion package
        run: node scripts/create-promotion.mjs

      - name: Create automatic TikTok video
        run: node scripts/create-tiktok-video.mjs

      - name: Save daily promotion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/selected-product.json data/selected-products.json data/promotion.json data/social-image.svg data/tiktok-video.mp4
          git diff --cached --quiet || git commit -m "Update daily promotion video"
          git push
