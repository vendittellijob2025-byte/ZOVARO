name: ZOVARO - Create Social Image

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-social-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Create social image
        run: node scripts/create-social-image.mjs

      - name: Save social image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/social-image.svg
          git diff --cached --quiet || git commit -m "Create social promotion image"
          git push
