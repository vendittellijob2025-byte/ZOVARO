name: ZOVARO - Select Promotion Product

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  select-product:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Select product
        run: node scripts/select-product.mjs

      - name: Save selected product
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/selected-product.json
          git diff --cached --quiet || git commit -m "Update selected promotion product"
          git push
