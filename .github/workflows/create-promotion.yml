name: ZOVARO - Create Promotion Package

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-promotion:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Create promotion package
        run: node scripts/create-promotion.mjs

      - name: Save promotion package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/promotion.json
          git diff --cached --quiet || git commit -m "Update promotion package"
          git push
