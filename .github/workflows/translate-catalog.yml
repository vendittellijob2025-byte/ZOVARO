name: ZOVARO - Translate Catalog

on:
  workflow_dispatch:

  schedule:
    # Resume small translation batches every six hours without blocking CJ imports.
    - cron: "43 */6 * * *"

permissions:
  contents: write

concurrency:
  group: zovaro-cj-products-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  translate-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Translate a safe batch
        run: node scripts/translate-to-english.mjs

      - name: Commit translations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json data/translation-cache.json

          if git diff --cached --quiet; then
            echo "No new translations."
            exit 0
          fi

          git commit -m "chore: translate CJ catalog batch"

          for attempt in 1 2; do
            git fetch origin "${GITHUB_REF_NAME}"
            if git rebase "origin/${GITHUB_REF_NAME}"; then
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                exit 0
              fi
              git rebase --abort || true
            else
              git rebase --abort || true
            fi

            if [ "$attempt" -lt 2 ]; then
              git fetch origin "${GITHUB_REF_NAME}"
              git reset --hard "origin/${GITHUB_REF_NAME}"
              node scripts/translate-to-english.mjs
              git add data/catalog.json data/translation-cache.json
              if git diff --cached --quiet; then
                echo "Latest branch already contains translated fields."
                exit 0
              fi
              git commit -m "chore: translate CJ catalog batch"
            fi
          done

          echo "Unable to push translation batch after two attempts."
          exit 1
