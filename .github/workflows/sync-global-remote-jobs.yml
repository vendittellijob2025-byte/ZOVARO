name: ZOVARO - Sync global remote jobs

on:
  workflow_dispatch:
  schedule:
    - cron: "15 13 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/sync-global-remote-jobs.mjs"
      - "scripts/validate-global-job-feed.mjs"
      - "marketplace.js"
      - "data/career-guides.json"
      - ".github/workflows/sync-global-remote-jobs.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: zovaro-global-jobs-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-global-remote-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check script syntax
        run: |
          node --check scripts/sync-global-remote-jobs.mjs
          node --check scripts/validate-global-job-feed.mjs
          node --check marketplace.js
          node --check api/jobs.js
      - name: Synchronize public global remote job sources
        run: node scripts/sync-global-remote-jobs.mjs
      - name: Validate source attribution, country eligibility and categories
        run: node scripts/validate-global-job-feed.mjs
      - name: Create or update draft PR for refreshed job listings
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: data/remote-jobs.json
          commit-message: "chore: refresh attributed global remote job listings"
          branch: jobs/daily-feed-updates
          delete-branch: false
          title: "JOBS: daily remote feed refresh"
          body: |
            Daily refresh of the public remote-job sources.
            Preserve each source's canonical listing URL and attribution.
            Review all changes before merging; no production publication is automatic.
          base: main
          draft: true
