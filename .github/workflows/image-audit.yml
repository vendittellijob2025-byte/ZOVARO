name: ZOVARO product image intelligence audit

on:
  push:
    branches:
      - main
    paths:
      - "scripts/audit-product-images.mjs"
      - "scripts/test-product-category.mjs"
      - "lib/product-category.js"
      - "data/category-tree.json"
      - ".github/workflows/image-audit.yml"
  workflow_dispatch:
    inputs:
      batch_size:
        description: Number of new or changed product images to inspect
        required: false
        default: "500"
  schedule:
    - cron: "17 3,9,15,21 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: zovaro-image-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      IMAGE_AUDIT_BATCH_SIZE: ${{ inputs.batch_size || '500' }}
    steps:
      - name: Checkout catalog
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Restore open-source vision model cache
        uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: zovaro-vision-yolos-clip-${{ runner.os }}-v2
          restore-keys: |
            zovaro-vision-yolos-clip-${{ runner.os }}-
            zovaro-yolos-tiny-${{ runner.os }}-

      - name: Install free local vision runtime (CPU-only)
        run: npm install --no-save --no-package-lock --onnxruntime-node-install-cuda=skip @huggingface/transformers@3.8.1

      - name: Run image-audit logic tests
        run: node scripts/audit-product-images.mjs --self-test

      - name: Verify product classification and browse paths
        run: node scripts/test-product-category.mjs

      - name: Analyse new and changed catalogue images
        run: node scripts/audit-product-images.mjs

      - name: Reclassify catalog and verify category quality
        run: |
          node scripts/reclassify-catalog-categories.mjs
          node scripts/audit-category-quality.mjs

      - name: Open a review PR for the image audit and corrected catalog
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: catalog/image-audit-review
          base: main
          delete-branch: false
          commit-message: "chore: update visual product audit and category corrections"
          title: "Catalog: review image audit and category corrections"
          body: |
            Automated image-audit and category-reclassification output for human review.

            This workflow never pushes catalog or image-audit changes directly to main. Review image evidence, category paths, image rights, product eligibility and existing affiliate tracking before merging. No automatic merge is configured.
          add-paths: |
            data/image-audit-report.json
            data/catalog.json
