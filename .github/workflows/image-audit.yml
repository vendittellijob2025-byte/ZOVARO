name: ZOVARO product image intelligence audit

on:
  push:
    branches:
      - main
    paths:
      - "scripts/audit-product-images.mjs"
      - "scripts/reclassify-catalog-categories.mjs"
      - "scripts/audit-category-quality.mjs"
      - "lib/product-category.js"
      - "data/category-tree.json"
      - ".github/workflows/image-audit.yml"
  workflow_dispatch:
    inputs:
      batch_size:
        description: Number of new or changed product images to inspect
        required: false
        default: "250"
  schedule:
    - cron: "17 3,9,15,21 * * *"

permissions:
  contents: write

concurrency:
  group: zovaro-catalog-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      IMAGE_AUDIT_BATCH_SIZE: ${{ inputs.batch_size || '250' }}
    steps:
      - name: Checkout catalog
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Restore open-source vision model cache
        uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: zovaro-vision-yolos-clip-${{ runner.os }}-v2
          restore-keys: |
            zovaro-vision-yolos-clip-${{ runner.os }}-
            zovaro-yolos-tiny-${{ runner.os }}-

      - name: Install free local vision runtime
        run: npm install --no-save --no-package-lock @huggingface/transformers@3.8.1

      - name: Run image-audit logic tests
        run: node scripts/audit-product-images.mjs --self-test

      - name: Analyse new and changed catalogue images
        run: node scripts/audit-product-images.mjs

      - name: Apply high-confidence visual category corrections
        run: |
          node scripts/reclassify-catalog-categories.mjs
          node scripts/audit-category-quality.mjs

      - name: Save image audit and corrected catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/image-audit-report.json data/catalog.json
          if git diff --cached --quiet; then
            echo "No image-audit report or category changes to commit."
          else
            git commit -m "chore: update visual product audit and category corrections"

            # Rebase over unrelated main-branch updates. Catalog writers share
            # a concurrency group; if another writer still changes the catalog,
            # refresh and rerun the audit instead of force-pushing stale data.
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then
                exit 0
              fi
              git rebase --abort || true
              if [ "$attempt" -lt 3 ]; then
                echo "Push conflict on attempt $attempt; refreshing and rerunning image audit."
                git fetch origin main
                git reset --hard origin/main
                node scripts/audit-product-images.mjs
                node scripts/reclassify-catalog-categories.mjs
                node scripts/audit-category-quality.mjs
                git add data/image-audit-report.json data/catalog.json
                if git diff --cached --quiet; then
                  echo "Latest main already contains the audited catalog."
                  exit 0
                fi
                git commit -m "chore: update visual product audit and category corrections"
              fi
            done

            echo "Unable to save image audit after three attempts."
            exit 1
          fi
