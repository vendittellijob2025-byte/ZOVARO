name: ZOVARO - D1 application store validation

on:
  push:
    branches:
      - fix/zovaro-d1-click-tracking
  pull_request:
    branches:
      - main
    paths:
      - "lib/cj-d1.js"
      - "lib/zovaro-store.js"
      - "api/lead-track.js"
      - "api/lead-admin-events.js"
      - "api/marketplace.js"
      - "api/tiktok-*.js"
      - "api/cj-commission-sync.js"
      - "cloudflare/d1/schema.sql"
      - ".github/workflows/zovaro-d1-store-check.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check all D1-backed routes and helpers
        run: |
          node --check lib/cj-d1.js
          node --check lib/zovaro-store.js
          node --check api/cj-commission-sync.js
          node --check api/lead-track.js
          node --check api/lead-admin-events.js
          node --check api/partner-postback.js
          node --check api/marketplace.js
          node --check api/tiktok-status.js
          node --check api/tiktok-callback.js
          node --check api/tiktok-maintenance.js
          node --check api/tiktok-direct-post.js
      - name: Validate D1 schema and uniqueness constraints
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          db = sqlite3.connect(":memory:")
          db.executescript(Path("cloudflare/d1/schema.sql").read_text())
          expected = {"cj_commissions", "cj_sync_state", "partner_conversion_events", "outbound_click_events", "app_records"}
          actual = {row[0] for row in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          assert expected <= actual, f"Missing D1 tables: {expected - actual}"
          print("D1 schema valid:", ", ".join(sorted(expected)))
          PY
      - name: Verify no application route imports Vercel Blob
        run: |
          if grep -R -n '@vercel/blob' api lib; then
            echo "A production API route still depends on Vercel Blob."
            exit 1
          fi
