name: ZOVARO - Verify curated job sources

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "data/career-guides.json"
      - "data/curated-jobs.json"
      - "index.html"
      - "marketplace.js"
      - "job.html"
      - "job-detail.js"
      - "api/marketplace.js"
      - "scripts/verify-curated-jobs.mjs"
      - "scripts/validate-jobs-portal.mjs"
      - "scripts/create-category-videos.mjs"
      - "scripts/select-product.mjs"
      - "scripts/create-tiktok-video.mjs"
      - "scripts/split-selected-products.mjs"
      - ".github/workflows/daily-promotion.yml"
      - ".github/workflows/daily-category-videos.yml"
      - ".github/workflows/verify-curated-jobs.yml"
  schedule:
    - cron: "15 13 * * *"
  push:
    branches:
      - main
    paths:
      - "data/curated-jobs.json"
      - "scripts/verify-curated-jobs.mjs"
      - ".github/workflows/verify-curated-jobs.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: zovaro-curated-jobs-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check JavaScript syntax
        run: |
          node --check marketplace.js
          node --check job-detail.js
          node --check api/marketplace.js
          node --check scripts/verify-curated-jobs.mjs
          node --check scripts/validate-jobs-portal.mjs
          node --check scripts/create-category-videos.mjs
          node --check scripts/select-product.mjs
          node --check scripts/create-tiktok-video.mjs
          node --check scripts/split-selected-products.mjs
      - name: Validate portal data and routes
        run: node scripts/validate-jobs-portal.mjs
      - name: Verify official employer sources
        run: node scripts/verify-curated-jobs.mjs
      - name: Create or update review PR for verification results
        if: github.event_name != 'pull_request'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: data/curated-jobs.json
          commit-message: "Verify curated job opportunities"
          branch: jobs/daily-feed-updates
          delete-branch: false
          title: "JOBS: daily verification updates"
          body: |
            Automated verification of employer-submitted and editorially curated job records.
            Review every status change and removal before merging. Temporary network failures
            must remain unverified rather than being treated as expired vacancies.
          base: main
