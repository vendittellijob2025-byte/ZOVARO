name: ZOVARO - Verify and reclassify Shop catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * *"
  push:
    branches:
      - main
    paths:
      - "app.js"
      - "app-cj-loader.js"
      - "lib/product-category.js"
      - "data/category-tree.json"
      - "scripts/reclassify-catalog-categories.mjs"
      - "scripts/validate-product-category-rules.mjs"
      - "scripts/report-category-coverage.mjs"
      - "scripts/audit-category-quality.mjs"
      - ".github/workflows/verify-shop-catalog.yml"

permissions:
  contents: write

concurrency:
  group: zovaro-catalog-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-shop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check app-cj-loader.js
          node --check lib/product-category.js
          node --check api/jobs.js
          node --check scripts/reclassify-catalog-categories.mjs
          node --check scripts/validate-product-category-rules.mjs
          node --check scripts/report-category-coverage.mjs
          node --check scripts/audit-category-quality.mjs
      - name: Reclassify existing products using primary product identity
        run: node scripts/reclassify-catalog-categories.mjs
      - name: Validate all 31 canonical category roots and collision examples
        run: node scripts/validate-product-category-rules.mjs
      - name: Audit category paths and product quality
        run: node scripts/audit-category-quality.mjs
      - name: Generate category coverage report
        run: node scripts/report-category-coverage.mjs
      - name: Commit catalog and category coverage report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json data/category-coverage.json
          if git diff --cached --quiet; then
            echo "No catalog classification changes."
            exit 0
          fi
          git commit -m "chore: reclassify catalog and report active shop categories"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
