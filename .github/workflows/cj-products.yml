name: ZOVARO - Sync CJ Products

on:
  workflow_dispatch:

  schedule:
    # Refresh joined advertisers and product feeds every six hours.
    - cron: "17 */6 * * *"

  push:
    branches:
      - main
    paths:
      - "scripts/sync-cj-advertisers.mjs"
      - "scripts/reclassify-catalog-categories.mjs"
      - "scripts/validate-product-category-rules.mjs"
      - "scripts/report-category-coverage.mjs"
      - "lib/product-category.js"
      - "lib/category-taxonomy.js"
      - "scripts/translate-to-english.mjs"
      - "app-cj-loader.js"
      - ".github/workflows/cj-products.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: zovaro-catalog-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-cj:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Discover joined advertisers and merge CJ products
        env:
          CJ_API_TOKEN: ${{ secrets.CJ_API_TOKEN }}
        run: node scripts/sync-cj-advertisers.mjs

      - name: Reclassify products using primary product identity
        run: node scripts/reclassify-catalog-categories.mjs

      - name: Verify category classifier coverage
        run: node scripts/validate-product-category-rules.mjs

      - name: Verify category consistency and storefront limits
        run: node scripts/audit-category-quality.mjs

      - name: Generate real product coverage report for every shop category
        run: node scripts/report-category-coverage.mjs

      # Translation is deliberately decoupled from catalog ingestion.
      # The public free translation endpoint is rate-limited and must not block
      # importing valid affiliate products or saving the catalog.

      - name: Open a review PR for the CJ catalog update
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: catalog/cj-feed-sync-review
          base: main
          delete-branch: false
          commit-message: "chore: sync CJ catalog and English translations"
          title: "Catalog: review CJ feed and translation update"
          body: |
            Automated CJ feed and translation output for human review.

            This workflow never pushes product data directly to main. Before merging, verify advertiser approval, feed/API licence, territorial eligibility, product categories, images and usage rights, affiliate URL generation, live click tests and attribution. A syntactically valid tracking URL is not proof of attribution. No automatic merge is configured.
          add-paths: |
            data/catalog.json
            data/translation-cache.json
            data/category-coverage.json
