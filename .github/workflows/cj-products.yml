name: ZOVARO - Sync CJ Products

on:
  workflow_dispatch:

  schedule:
    # Refresh joined advertisers and product feeds every six hours.
    - cron: "17 */6 * * *"

  push:
    branches:
      - main
    paths:
      - "scripts/sync-cj-advertisers.mjs"
      - "app-cj-loader.js"

permissions:
  contents: write

concurrency:
  group: zovaro-catalog-sync-${{ github.ref }}
  queue: max

jobs:
  sync-cj:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Discover joined advertisers and merge CJ products
        env:
          CJ_API_TOKEN: ${{ secrets.CJ_API_TOKEN }}
        run: node scripts/sync-cj-advertisers.mjs

      - name: Reclassify products using primary product identity
        run: node scripts/reclassify-catalog-categories.mjs

      - name: Verify category classifier coverage
        run: node scripts/validate-product-category-rules.mjs

      - name: Test product identity and category collision rules
        run: node scripts/test-product-category.mjs

      - name: Verify category consistency and storefront limits
        run: node scripts/audit-category-quality.mjs

      - name: Generate real product coverage report for every shop category
        run: node scripts/report-category-coverage.mjs

      # Translation is deliberately decoupled from catalog ingestion.
      # The public free translation endpoint is rate-limited and must not block
      # importing valid affiliate products or saving the catalog.

      - name: Publish validated catalogue update to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CJ_API_TOKEN: ${{ secrets.CJ_API_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json data/translation-cache.json data/category-coverage.json
          if git diff --cached --quiet; then
            echo "No catalogue changes to publish."
            exit 0
          fi
          git commit -m "chore: publish validated CJ catalogue update"

          # Another workflow may update main while CJ feeds are being fetched.
          # Never force-push a stale catalogue over that newer commit.
          if git push origin HEAD:main; then
            exit 0
          fi

          echo "main advanced during catalogue sync; rebuilding against latest main."
          git fetch origin main
          git reset --hard origin/main
          node scripts/sync-cj-advertisers.mjs
          node scripts/reclassify-catalog-categories.mjs
          node scripts/validate-product-category-rules.mjs
          node scripts/test-product-category.mjs
          node scripts/audit-category-quality.mjs
          node scripts/report-category-coverage.mjs
          git add data/catalog.json data/translation-cache.json data/category-coverage.json
          if git diff --cached --quiet; then
            echo "Latest main already contains the validated catalogue state."
            exit 0
          fi
          git commit -m "chore: publish rebased validated CJ catalogue update"
          git push origin HEAD:main
