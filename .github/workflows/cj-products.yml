name: ZOVARO - Sync CJ Products

on:
  workflow_dispatch:

  schedule:
    # Refresh joined advertisers and product feeds every six hours.
    - cron: "17 */6 * * *"

  push:
    branches:
      - main
    paths:
      - "scripts/sync-cj-advertisers.mjs"
      - "scripts/translate-to-english.mjs"
      - "app-cj-loader.js"

permissions:
  contents: write

concurrency:
  group: zovaro-cj-products-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-cj:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Discover joined advertisers and merge CJ products
        env:
          CJ_API_TOKEN: ${{ secrets.CJ_API_TOKEN }}
        run: node scripts/sync-cj-advertisers.mjs

      # Translation is deliberately decoupled from catalog ingestion.
      # The public free translation endpoint is rate-limited and must not block
      # importing valid affiliate products or saving the catalog.

      - name: Commit updated catalog and translations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/catalog.json data/translation-cache.json

          if git diff --cached --quiet; then
            echo "No catalog or translation changes."
            exit 0
          fi

          git commit -m "chore: sync CJ catalog and English translations"

          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
