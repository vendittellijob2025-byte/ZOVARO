name: ZOVARO - Sync CJ Products

on:
  workflow_dispatch:

  schedule:
    # Refresh joined advertisers and product feeds every six hours.
    - cron: "17 */6 * * *"

  push:
    branches:
      - main
    paths:
      - "scripts/sync-cj-advertisers.mjs"
      - "scripts/reclassify-catalog-categories.mjs"
      - "lib/product-category.js"
      - "scripts/translate-to-english.mjs"
      - "app-cj-loader.js"
      - ".github/workflows/cj-products.yml"

permissions:
  contents: write

concurrency:
  group: zovaro-cj-products-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-cj:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Discover joined advertisers and merge CJ products
        env:
          CJ_API_TOKEN: ${{ secrets.CJ_API_TOKEN }}
        run: node scripts/sync-cj-advertisers.mjs

      - name: Reclassify every catalog product by its primary product type
        run: node scripts/reclassify-catalog-categories.mjs

      # Translation is deliberately decoupled from catalog ingestion.
      # The public free translation endpoint is rate-limited and must not block
      # importing valid affiliate products or saving the catalog.

      - name: Commit updated compact catalog
        env:
          CJ_API_TOKEN: ${{ secrets.CJ_API_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/catalog.json data/translation-cache.json

          if git diff --cached --quiet; then
            echo "No catalog or translation changes."
            exit 0
          fi

          git commit -m "chore: sync CJ catalog and English translations"

          # Other repository updates can land while the large CJ feeds are
          # downloading. If catalog.json conflicts during rebase, rebuild the
          # catalog on top of the newest main instead of losing the feed sync.
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"

            if git rebase "origin/${GITHUB_REF_NAME}"; then
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                exit 0
              fi
              git rebase --abort || true
            else
              git rebase --abort || true
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Push conflict on attempt $attempt; rebuilding catalog on latest branch."
              git fetch origin "${GITHUB_REF_NAME}"
              git reset --hard "origin/${GITHUB_REF_NAME}"
              node scripts/sync-cj-advertisers.mjs
              node scripts/reclassify-catalog-categories.mjs
              git add data/catalog.json data/translation-cache.json
              if git diff --cached --quiet; then
                echo "Latest branch already contains the current catalog."
                exit 0
              fi
              git commit -m "chore: sync CJ catalog and English translations"
            fi
          done

          echo "Unable to push CJ catalog after three attempts."
          exit 1
