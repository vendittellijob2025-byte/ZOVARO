name: Validate ZOVARO CJ catalog sync

on:
  push:
    branches:
      - main
    paths:
      - "scripts/sync-cj-advertisers.mjs"
      - "scripts/translate-to-english.mjs"
      - "scripts/create-tiktok-video.mjs"
      - "scripts/select-product.mjs"
      - "app.js"
      - "app-cj-loader.js"
      - "api/lead-track.js"
      - "package.json"
      - "api/tiktok-direct-post.js"
      - "vercel.json"
      - "lead-sales-dashboard.html"
      - "api/lead-admin-events.js"
      - "api/marketplace.js"
      - "api/marketplace-admin.js"
      - "marketplace.js"
      - "marketplace.css"
      - "marketplace-admin.html"
      - "index.html"
      - "privacy.html"
      - "terms.html"
      - "api/cj-commission-sync.js"
      - "data/catalog.json"
      - ".github/workflows/cj-products.yml"
      - ".github/workflows/cj-commission-sync.yml"
      - ".github/workflows/validate-cj-sync.yml"
  pull_request:
    branches:
      - main
    paths:
      - "scripts/sync-cj-advertisers.mjs"
      - "scripts/translate-to-english.mjs"
      - "scripts/create-tiktok-video.mjs"
      - "scripts/select-product.mjs"
      - "app.js"
      - "app-cj-loader.js"
      - "api/lead-track.js"
      - "package.json"
      - "api/tiktok-direct-post.js"
      - "data/catalog.json"
      - ".github/workflows/cj-products.yml"
      - ".github/workflows/cj-commission-sync.yml"
      - ".github/workflows/validate-cj-sync.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check JavaScript syntax
        run: |
          node --check scripts/sync-cj-advertisers.mjs
          node --check scripts/translate-to-english.mjs
          node --check scripts/create-tiktok-video.mjs
          node --check scripts/select-product.mjs
          node --check app.js
          node --check app-cj-loader.js
          node --check api/lead-track.js
          node --check api/cj-commission-sync.js
          node --check api/lead-admin-events.js
          node --check api/marketplace.js
          node --check marketplace.js
          node --check api/tiktok-direct-post.js
          node --input-type=module -e '
            import fs from "node:fs";
            import vm from "node:vm";
            const html = fs.readFileSync("lead-sales-dashboard.html", "utf8");
            const scripts = html.split("<script>").slice(1).map(part => part.split("</script>")[0]);
            if (!scripts.length) throw new Error("Dashboard script not found.");
            for (const script of scripts) new vm.Script(script, { filename: "lead-sales-dashboard.html" });
            const homepage = fs.readFileSync("index.html", "utf8");
            const inlineScripts = homepage.split("<script>").slice(1).map(part => part.split("</script>")[0]).filter(script => script.trim());
            for (const script of inlineScripts) new vm.Script(script, { filename: "index.html" });
            const admin = fs.readFileSync("marketplace-admin.html", "utf8");
            const adminScripts = admin.split("<script>").slice(1).map(part => part.split("</script>")[0]).filter(script => script.trim());
            for (const script of adminScripts) new vm.Script(script, { filename: "marketplace-admin.html" });
            JSON.parse(fs.readFileSync("vercel.json", "utf8"));
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            if (pkg.type !== "module") throw new Error("package.json must declare native ESM.");
            if (!pkg.dependencies?.["@vercel/blob"]) throw new Error("@vercel/blob dependency is missing.");
            console.log("Node.js package configuration is valid.");
            console.log("Dashboard JavaScript and Vercel configuration are valid.");
          '

      - name: Production read-only smoke tests
        run: |
          set -euo pipefail
          BASE_URL="https://zovaro.vercel.app"

          HOME_STATUS=""
          for attempt in $(seq 1 30); do
            HOME_STATUS="$(curl --silent --show-error --output /tmp/zovaro-home.html --write-out '%{http_code}' --max-time 15 "$BASE_URL/")"
            if [ "$HOME_STATUS" = "200" ]; then
              break
            fi
            sleep 10
          done
          test "$HOME_STATUS" = "200"
          grep -qi "ZOVARO" /tmp/zovaro-home.html

          curl --fail --silent --show-error --max-time 30 "$BASE_URL/data/catalog.json" -o /tmp/zovaro-catalog.json
          node --input-type=module -e '
            import fs from "node:fs";
            const catalog = JSON.parse(fs.readFileSync("/tmp/zovaro-catalog.json", "utf8"));
            if (!Array.isArray(catalog.products) || catalog.products.length === 0) throw new Error("Production catalog is empty.");
            const usable = catalog.products.filter(p =>
              p && p.joinedStatus === true &&
              /^https:\/\//i.test(p.clickUrl || "") &&
              typeof p.englishTitle === "string" && p.englishTitle.trim() &&
              typeof p.englishCategory === "string" && p.englishCategory.trim()
            );
            if (!usable.length) throw new Error("Production catalog has no translated, tracked products.");
            console.log("Production catalog smoke test: " + catalog.products.length + " records; " + usable.length + " translated and tracked products.");
          '

          TRACK_STATUS="$(curl --silent --show-error --output /tmp/zovaro-track-response.json --write-out '%{http_code}' --max-time 15 "$BASE_URL/api/lead-track")"
          test "$TRACK_STATUS" = "400"

          MARKETPLACE_STATUS=""
          for attempt in $(seq 1 30); do
            MARKETPLACE_STATUS="$(curl --silent --show-error --output /tmp/zovaro-marketplace.json --write-out '%{http_code}' --max-time 20 "$BASE_URL/api/marketplace?type=job")"
            if [ "$MARKETPLACE_STATUS" = "200" ]; then
              break
            fi
            sleep 10
          done
          test "$MARKETPLACE_STATUS" = "200"
          node --input-type=module -e '
            import fs from "node:fs";
            const listings = JSON.parse(fs.readFileSync("/tmp/zovaro-marketplace.json", "utf8"));
            if (!Array.isArray(listings)) throw new Error("Marketplace GET did not return a listing array.");
            if (listings.some(item => item.status || item.contactEmail === undefined && item.publicContact)) throw new Error("Marketplace response contains internal fields.");
            console.log("Marketplace public read test passed: " + listings.length + " approved jobs.");
          '

          MARKETPLACE_ADMIN_STATUS="$(curl --silent --show-error --output /tmp/zovaro-marketplace-admin.json --write-out '%{http_code}' --max-time 15 "$BASE_URL/api/marketplace?admin=1")"
          test "$MARKETPLACE_ADMIN_STATUS" = "401"

          COMMISSION_STATUS="$(curl --silent --show-error --output /tmp/zovaro-commission-response.json --write-out '%{http_code}' --max-time 15 -X POST -H "Content-Type: application/json" --data '{}' "$BASE_URL/api/cj-commission-sync")"
          test "$COMMISSION_STATUS" = "401"

          echo "Production read-only smoke tests passed."
      - name: Validate existing catalog integrity
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const catalog = JSON.parse(fs.readFileSync("data/catalog.json", "utf8"));
            if (!Array.isArray(catalog.products) || catalog.products.length === 0) throw new Error("Catalog products array is empty.");
            const invalid = catalog.products.filter(p => !p || p.joinedStatus !== true || !/^https:\/\//i.test(p.clickUrl || ""));
            if (invalid.length) throw new Error("Existing catalog contains " + invalid.length + " products without a valid joined status and HTTPS click URL.");
            const ids = new Set();
            for (const p of catalog.products) {
              const key = [p.source || "", p.advertiserId || "", p.id || ""].join("|");
              if (ids.has(key)) throw new Error("Duplicate catalog product: " + key);
              ids.add(key);
            }
            console.log("Existing catalog valid: " + catalog.products.length + " products.");
          '
