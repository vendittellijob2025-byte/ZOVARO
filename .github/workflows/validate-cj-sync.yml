name: Validate ZOVARO CJ catalog sync

on:
  push:
    branches:
      - main
    paths:
      - "scripts/sync-cj-advertisers.mjs"
      - "scripts/translate-to-english.mjs"
      - "scripts/create-tiktok-video.mjs"
      - "scripts/select-product.mjs"
      - "app.js"
      - "app-cj-loader.js"
      - "api/lead-track.js"
      - "package.json"
      - "api/tiktok-direct-post.js"
      - "vercel.json"
      - "lead-sales-dashboard.html"
      - "api/lead-admin-events.js"
      - "api/cj-commission-sync.js"
      - "data/catalog.json"
      - ".github/workflows/cj-products.yml"
      - ".github/workflows/cj-commission-sync.yml"
      - ".github/workflows/validate-cj-sync.yml"
  pull_request:
    branches:
      - main
    paths:
      - "scripts/sync-cj-advertisers.mjs"
      - "scripts/translate-to-english.mjs"
      - "scripts/create-tiktok-video.mjs"
      - "scripts/select-product.mjs"
      - "app.js"
      - "app-cj-loader.js"
      - "api/lead-track.js"
      - "package.json"
      - "api/tiktok-direct-post.js"
      - "data/catalog.json"
      - ".github/workflows/cj-products.yml"
      - ".github/workflows/cj-commission-sync.yml"
      - ".github/workflows/validate-cj-sync.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check JavaScript syntax
        run: |
          node --check scripts/sync-cj-advertisers.mjs
          node --check scripts/translate-to-english.mjs
          node --check scripts/create-tiktok-video.mjs
          node --check scripts/select-product.mjs
          node --check app.js
          node --check app-cj-loader.js
          node --check api/lead-track.js
          node --check api/cj-commission-sync.js
          node --check api/lead-admin-events.js
          node --check api/tiktok-direct-post.js
          node --input-type=module -e '
            import fs from "node:fs";
            import vm from "node:vm";
            const html = fs.readFileSync("lead-sales-dashboard.html", "utf8");
            const scripts = html.split("<script>").slice(1).map(part => part.split("</script>")[0]);
            if (!scripts.length) throw new Error("Dashboard script not found.");
            for (const script of scripts) new vm.Script(script, { filename: "lead-sales-dashboard.html" });
            JSON.parse(fs.readFileSync("vercel.json", "utf8"));
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            if (pkg.type !== "module") throw new Error("package.json must declare native ESM.");
            if (!pkg.dependencies?.["@vercel/blob"]) throw new Error("@vercel/blob dependency is missing.");
            console.log("Node.js package configuration is valid.");
            console.log("Dashboard JavaScript and Vercel configuration are valid.");
          '

      - name: Validate existing catalog integrity
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const catalog = JSON.parse(fs.readFileSync("data/catalog.json", "utf8"));
            if (!Array.isArray(catalog.products) || catalog.products.length === 0) throw new Error("Catalog products array is empty.");
            const invalid = catalog.products.filter(p => !p || p.joinedStatus !== true || !/^https:\/\//i.test(p.clickUrl || ""));
            if (invalid.length) throw new Error("Existing catalog contains " + invalid.length + " products without a valid joined status and HTTPS click URL.");
            const ids = new Set();
            for (const p of catalog.products) {
              const key = [p.source || "", p.advertiserId || "", p.id || ""].join("|");
              if (ids.has(key)) throw new Error("Duplicate catalog product: " + key);
              ids.add(key);
            }
            console.log("Existing catalog valid: " + catalog.products.length + " products.");
          '
