name: ZOVARO - Commission Ledger Checks

on:
  pull_request:
    paths:
      - "api/cj-commission-sync-d1.js"
      - "lib/cj-d1.js"
      - "api/lead-admin-events.js"
      - "cloudflare/d1/**"
      - ".github/workflows/commission-ledger-check.yml"

permissions:
  contents: read

jobs:
  syntax-and-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check api/cj-commission-sync-d1.js
          node --check lib/cj-d1.js
          node --check api/lead-admin-events.js
      - name: Validate D1 schema with SQLite
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          db = sqlite3.connect(":memory:")
          db.executescript(Path("cloudflare/d1/schema.sql").read_text())
          tables = {row[0] for row in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          assert {"cj_commissions", "cj_sync_state"} <= tables
          print("D1 schema OK")
          PY
